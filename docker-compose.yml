services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops_db
      MYSQL_USER: devops
      MYSQL_PASSWORD: devops123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/projets-backend:${TAG:-latest}
    container_name: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/devops_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: devops
      SPRING_DATASOURCE_PASSWORD: devops123
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - devops-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/projets-frontend:${TAG:-latest}
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - devops-network

volumes:
  mysql-data:

networks:
  devops-network:
    driver: bridge
